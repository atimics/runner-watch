name: rati-local

x-app-build: &app-build
  context: .
  target: runtime
  args:
    APP_BUILD_SHA: local-compose

x-app-environment: &app-environment
  APP_BUILD_SHA: local-compose
  APP_ORIGIN: http://127.0.0.1:8080
  RUNNERS_ORIGIN: http://127.0.0.1:8080
  SPORTS_ORIGIN: http://127.0.0.1:8080
  LEGACY_ORIGIN: http://127.0.0.1:8080
  RP_ID: 127.0.0.1
  LEGACY_RP_ID: 127.0.0.1
  COOKIE_SECURE: "0"
  TRUST_FLY_CLIENT_IP: "0"
  DATABASE_URL: postgresql://rati:rati-local@database:5432/rati
  REQUIRE_DATABASE_URL: "1"
  REQUIRE_DATABASE_TLS: "0"
  ALLOW_NEWER_DATABASE_SCHEMA: "0"
  REDIS_URL: redis://cache:6379/0
  REQUIRE_REDIS_TLS: "0"
  RATE_LIMIT_HASH_KEY: local-development-rate-limit-key
  REQUIRE_RATE_LIMIT_HASH_KEY: "1"
  WORKER_EXPECTED_INSTANCES: "1"
  BACKGROUND_SCAN_INTERVAL_SECONDS: "1800"
  RANKER_TRAIN_INTERVAL_SECONDS: "21600"
  RANKER_TRAIN_HEARTBEAT_SECONDS: "30"
  RANKER_HISTORICAL_BACKFILL_ENABLED: "false"
  SPORTS_INGESTION_ENABLED: "true"
  SPORTS_REFRESH_SECONDS: "600"
  ODDS_API_ENABLED: "false"
  DISCOVERY_SOURCES_ENABLED: "true"
  DISCOVERY_INTERVAL_SECONDS: "30"
  YAHOO_NEWS_ENABLED: "true"
  APEWISDOM_SOCIAL_ENABLED: "true"
  GDELT_NEWS_ENABLED: "false"
  BLUESKY_SEARCH_ENABLED: "false"
  NASDAQ_TRADE_HALTS_ENABLED: "true"
  SEC_USER_AGENT: ${SEC_USER_AGENT:-RATi-Local/0.3 local@example.invalid}

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rati
      POSTGRES_USER: rati
      POSTGRES_PASSWORD: rati-local
    volumes:
      - rati-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rati -d rati"]
      interval: 3s
      timeout: 3s
      retries: 20

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: *app-build
    command: ["stonks-migrate"]
    environment:
      <<: *app-environment
    depends_on:
      database:
        condition: service_healthy

  web:
    build: *app-build
    command:
      - uvicorn
      - runner_web.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --no-proxy-headers
      - --no-access-log
    environment:
      <<: *app-environment
      PROCESS_ROLE: web
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      cache:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  worker:
    build: *app-build
    command: ["stonks-worker"]
    environment:
      <<: *app-environment
      PROCESS_ROLE: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      cache:
        condition: service_healthy
    restart: unless-stopped

  trainer:
    build: *app-build
    command: ["stonks-trainer"]
    environment:
      <<: *app-environment
      PROCESS_ROLE: trainer
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  rati-postgres:
