{% macro sports_opinion_glyph(forecast, glyph_id) %}
<svg class="sports-chance-ring" viewBox="0 0 40 40" role="img" aria-label="{{ forecast.description }}">
  {% if forecast.factors %}
  <defs>
    <pattern id="{{ glyph_id }}-negative" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="4" fill="var(--amber)"/>
      <path d="M 0 0 L 0 4" stroke="var(--text)" stroke-width="1" opacity=".7"/>
    </pattern>
  </defs>
  {% endif %}
  <circle class="chance-track" cx="20" cy="20" r="16"/>
  <circle class="chance-value" cx="20" cy="20" r="16" pathLength="100" stroke-dasharray="{{ forecast.percent }} 100"/>
  {% if forecast.factors %}
    {% for factor in forecast.factors if factor.share > 0.1 %}
    <circle class="sports-factor sports-factor-{{ factor.key }}{% if factor.negative %} is-negative{% endif %}" cx="20" cy="20" r="7" pathLength="100" stroke-dasharray="{{ factor.share|round(3) }} 100" stroke-dashoffset="{{ -(factor.offset|round(3)) }}"{% if factor.negative %} style="stroke:url(#{{ glyph_id }}-negative)"{% endif %}/>
    {% endfor %}
  {% else %}
  <circle class="sports-factor-pending" cx="20" cy="20" r="7"/>
  {% endif %}
</svg>
{% endmacro %}
