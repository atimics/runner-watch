<section class="ticker-map" id="token-replay" data-token-replay data-coin-id="{{ coin.id }}" aria-label="{{ coin.symbol }} score, wallets and events">
  <p class="map-status" role="status" data-replay-status>Loading…</p>
  <div data-replay-content>
    <div class="map-workspace">
      <div class="map-canvas"><svg viewBox="0 0 760 440" data-replay-graph role="group" aria-label="Token and connected wallets"></svg><div class="map-paging" data-replay-paging hidden><button type="button" data-replay-previous aria-label="Previous wallets">←</button><span data-replay-page></span><button type="button" data-replay-next aria-label="Next wallets">→</button></div></div>
      <aside class="map-source" aria-label="Score or selected chain evidence"><button class="map-score-return" type="button" data-replay-score-return hidden>← Return to score overview</button><div data-replay-selection aria-live="polite" aria-atomic="true"></div>
      {% if screen.item.contract_address %}<div class="token-contract"><button type="button" data-copy-contract data-contract="{{ screen.item.contract_address }}" title="{{ screen.item.contract_address }}">Copy CA</button><span class="sr-only" role="status" data-copy-status></span><code data-contract-fallback hidden>{{ screen.item.contract_address }}</code></div>{% endif %}</aside>
    </div>
    <div class="map-filings"><div class="map-event-list" data-replay-events aria-label="Recorded chain events"></div></div>
  </div>
  <noscript><p>Enable JavaScript to explore the saved token events.</p></noscript>
</section>
