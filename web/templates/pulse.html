{% extends "mobile_base.html" %}
{% block title %}Pulse · Runner Watch{% endblock %}
{% block content %}
<header class="screen-head">
  <div><h1>Pulse</h1></div>
  {% if user %}
    <button class="avatar-button" type="button" data-profile aria-label="Open profile">{{ user.username[:1]|upper }}</button>
  {% else %}
    <a class="avatar-button signed-out" href="/login" aria-label="Log in">↗</a>
  {% endif %}
</header>
{% include "_market_clock.html" %}

<main class="list-section pulse-feed">
  <div class="token-list" id="pulseList" aria-live="polite"></div>
</main>
{% endblock %}
{% block scripts %}
<script nonce="{{ request.state.csp_nonce }}">
let pulse={{ pulse|tojson }};
const list=document.getElementById('pulseList');
function render(changedTickers = new Set()) {
  const rows = pulse.rows || [];
  list.innerHTML = rows.map(row => TickerRow.render(row,{updated:changedTickers.has(row.ticker)})).join('') || `<div class="empty-list"><strong>No movement</strong></div>`;
  TickerRow.paintCharts();
}
render();TickerRow.loadCharts('/api/pulse/charts');let pollCount=0;
setInterval(async () => {
  try {
    const response = await fetch('/api/pulse');
    if (response.ok) {
      const nextPulse = await response.json();
      const previous = new Map((pulse.rows || []).map(row => [row.ticker, TickerRow.fingerprint(row)]));
      const changed = new Set((nextPulse.rows || []).filter(row => previous.get(row.ticker) !== TickerRow.fingerprint(row)).map(row => row.ticker));
      pulse = nextPulse;
      render(changed);
      pollCount+=1;if(pollCount%6===0)TickerRow.loadCharts('/api/pulse/charts');
    }
  } catch (_) {}
}, 15000);
</script>
{% endblock %}
