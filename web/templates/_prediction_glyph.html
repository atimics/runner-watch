{% macro prediction_glyph(ticker) -%}
{% set selected = ticker.selected %}
<span class="prediction-glyph" role="img" aria-label="{{ ticker.description|default('Forecast pending') }}" title="{{ ticker.description|default('Forecast pending') }} · Outer ring RATi, inner ring market">
<svg viewBox="0 0 40 40" aria-hidden="true">
  <circle class="prediction-ring-track" cx="20" cy="20" r="17"/>
  <circle class="prediction-ring-track" cx="20" cy="20" r="11"/>
  {% if selected and selected.percent is not none %}<circle class="prediction-ring-model" cx="20" cy="20" r="17" pathLength="100" stroke-dasharray="{{ selected.percent }} 100"/>{% endif %}
  {% if selected and selected.benchmark %}<circle class="prediction-ring-market" cx="20" cy="20" r="11" pathLength="100" stroke-dasharray="{{ selected.benchmark.percent }} 100"/>{% endif %}
</svg>
</span>
{%- endmacro %}
