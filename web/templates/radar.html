{% extends "mobile_base.html" %}
{% block title %}Radar · Runner Watch{% endblock %}
{% block content %}
<header class="screen-head">
  <div><h1>Radar</h1><span class="head-meta"><b id="watchCount">{{ watches|length }}</b> events <i></i><span id="radarStatus">Live</span></span></div>
  {% if user %}<button class="avatar-button" type="button" data-profile aria-label="Open profile">{{ user.display_name[:1]|upper }}</button>{% else %}<a class="avatar-button signed-out" href="/login" aria-label="Log in">↗</a>{% endif %}
</header>
<button class="pulse-refresh radar-refresh" id="radarRefresh" type="button" aria-live="polite" hidden>New Radar update</button>

<main class="list-section radar-section">
  <div class="token-list" id="radarList"></div>
</main>
{% endblock %}
{% block scripts %}
<script nonce="{{ request.state.csp_nonce }}">
let rows={{ watches|tojson }};const list=document.getElementById('radarList');
const refreshButton=document.getElementById('radarRefresh');
let pendingRows=null;
const pendingUpdateTickers=new Set();
function render(){
  document.getElementById('watchCount').textContent=rows.length;
  list.innerHTML=rows.map(item=>TickerRow.render(item,{updated:item.has_update})).join('')||`<div class="empty-list radar-empty"><strong>Watching for new events</strong></div>`;
  TickerRow.paintCharts();
}
refreshButton.addEventListener('click',()=>{
  if(!pendingRows)return;
  rows=pendingRows;pendingRows=null;pendingUpdateTickers.clear();refreshButton.hidden=true;
  render();TickerRow.loadCharts('/api/radar/charts');
});
render();TickerRow.loadCharts('/api/radar/charts');let pollCount=0;
setInterval(async()=>{
  try{
    const response=await fetch('/api/radar');
    if(!response.ok)return;
    const data=await response.json();
    const updates=(data.rows||[]).filter(item=>item.has_update);
    if(updates.length){
      pendingRows=data.rows||[];
      updates.forEach(item=>pendingUpdateTickers.add(item.ticker));
      const count=pendingUpdateTickers.size;
      refreshButton.textContent=count===1?'New Radar update':`${count} new Radar updates`;
      refreshButton.hidden=false;
      if('Notification'in window&&Notification.permission==='granted')new Notification(`${updates[0].ticker} event`,{body:updates[0].pulse_label});
    }
    document.getElementById('radarStatus').textContent='Live';
    pollCount+=1;
    if(pollCount%4===0)TickerRow.loadCharts('/api/radar/charts');
  }catch(_){document.getElementById('radarStatus').textContent='Offline';}
},30000);
</script>
{% endblock %}
