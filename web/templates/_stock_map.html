<section class="ticker-map" id="ticker-map" data-stock-map data-ticker="{{ detail.ticker }}" aria-labelledby="stockMapTitle">
  <header class="map-heading"><div><p class="eyebrow">PEOPLE &amp; FILINGS</p><h2 id="stockMapTitle">{{ detail.ticker }} map</h2></div><div class="map-tabs" role="group" aria-label="Map view"><button type="button" data-map-view="activity" aria-pressed="true">Activity</button><button type="button" data-map-view="ownership" aria-pressed="false">Ownership</button></div></header>
  <p class="map-status" role="status" data-map-status>Loading saved SEC filings…</p>
  <div class="map-workspace">
    <div class="map-canvas"><div class="map-key"><span class="up">● Bought</span><span class="down">● Sold</span><span>● Other</span></div><svg viewBox="0 0 760 440" data-map-graph role="group" aria-label="People linked to {{ detail.ticker }}"></svg><div class="map-paging"><button type="button" data-map-previous aria-label="Previous people">←</button><span data-map-page></span><button type="button" data-map-next aria-label="Next people">→</button></div></div>
    <aside class="map-source" aria-label="Selected filing"><p class="eyebrow">FILING</p><div data-map-selection></div></aside>
  </div>
  <div class="map-timebar"><label for="stockMapTime">Known by filing date <strong data-map-time>Latest saved filing</strong></label><input type="range" id="stockMapTime" data-map-time-slider min="0" max="0" value="0" disabled><button type="button" data-map-latest>Latest</button></div>
  <div class="map-activity-heading"><h3 data-map-list-title>Reported activity</h3><label>Action <select data-map-filter aria-label="Filter reported action"><option value="all">All actions</option><option value="Bought">Bought</option><option value="Sold">Sold</option><option value="other">Other actions</option></select></label></div>
  <div class="map-event-list" data-map-events aria-label="Reported events"></div>
  <button class="map-load" type="button" data-map-load hidden>Load older filings</button>
  <p class="map-note" data-map-coverage></p><p class="map-note" data-map-ownership-note hidden>Ownership is reported for each person and share class. Shared interests can overlap. Each filing has its own as-of date.</p>
  <noscript><p>Enable JavaScript to explore this ticker’s map. The company filings below include direct SEC links.</p></noscript>
</section>
