<section class="ticker-map" id="ticker-map" data-stock-map data-ticker="{{ detail.ticker }}" aria-label="{{ detail.ticker }} score, wallets and filings">
  <p class="map-status" role="status" data-map-status>Loading…</p>
  <div class="map-workspace">
    <div class="map-canvas"><svg viewBox="0 0 760 440" data-map-graph data-phase="settled" role="group" aria-label="Current score and wallets linked to {{ detail.ticker }}"></svg><div class="map-paging" data-map-paging><button type="button" data-map-previous aria-label="Previous wallets">←</button><span data-map-page></span><button type="button" data-map-next aria-label="Next wallets">→</button></div></div>
    <aside class="map-source" aria-label="Score or selected filing"><button class="map-score-return" type="button" data-map-score-return hidden>← Return to score overview</button><div data-map-selection aria-live="polite" aria-atomic="true"></div></aside>
  </div>
  <div class="map-filings">
    <div class="map-event-list" data-map-events aria-label="Reported filings"></div>
    <div class="map-paging map-filings-paging" data-map-filings-paging><button type="button" data-map-filings-previous aria-label="Previous filings">←</button><span data-map-filings-page></span><button type="button" data-map-filings-next aria-label="Next filings">→</button></div>
  </div>
  <button class="map-load" type="button" data-map-load hidden>Load older filings</button>
  <noscript><p>Enable JavaScript to explore this ticker’s map.</p>{% if detail.events %}<h3>SEC filings</h3>{% for event in detail.events %}<p><a href="{{ event.filing_url }}" target="_blank" rel="noopener noreferrer">{{ event.form }} · {{ event.filed_at[:10] }} ↗</a> <span>{{ event.kind }}</span></p>{% endfor %}{% endif %}</noscript>
</section>
