{% extends "mobile_base.html" %}
{% block title %}Passkey login · Runner Watch{% endblock %}
{% block head %}<link rel="stylesheet" href="/static/auth-mobile.css">{% endblock %}
{% block content %}
<header class="detail-nav auth-nav">
  <a href="/" aria-label="Back to Pulse">‹</a>
  <strong>Runner Watch</strong>
  <span></span>
</header>
<main class="mobile-auth-wrap">
  <section class="mobile-auth-card">
    <h1>Login with passkey</h1>
    <button class="auth-submit" id="authButton">Login with passkey</button>
    <div id="authStatus" class="status" aria-live="polite"></div>
  </section>
</main>
{% endblock %}
{% block bottom_nav %}{% endblock %}
{% block scripts %}
<script nonce="{{ request.state.csp_nonce }}">
const statusBox = document.getElementById('authStatus');
const button = document.getElementById('authButton');
let action = 'login';
const requestedNext = new URLSearchParams(location.search).get('next') || '/';
const nextPath = requestedNext.startsWith('/') && !requestedNext.startsWith('//') ? requestedNext : '/';
function b64bytes(value) {
  const padded = value.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - value.length % 4) % 4);
  return Uint8Array.from(atob(padded), c => c.charCodeAt(0));
}
function bytesB64(value) {
  const bytes = new Uint8Array(value); let text = '';
  bytes.forEach(byte => text += String.fromCharCode(byte));
  return btoa(text).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function prepareCreate(options) {
  options.challenge = b64bytes(options.challenge);
  options.user.id = b64bytes(options.user.id);
  options.excludeCredentials = (options.excludeCredentials || []).map(x => ({...x, id: b64bytes(x.id)}));
  return options;
}
function prepareGet(options) {
  options.challenge = b64bytes(options.challenge);
  options.allowCredentials = (options.allowCredentials || []).map(x => ({...x, id: b64bytes(x.id)}));
  return options;
}
function serialize(credential) {
  const response = credential.response;
  const data = {
    id: credential.id, rawId: bytesB64(credential.rawId), type: credential.type,
    authenticatorAttachment: credential.authenticatorAttachment,
    clientExtensionResults: credential.getClientExtensionResults(),
    response: {clientDataJSON: bytesB64(response.clientDataJSON)}
  };
  if (response.attestationObject) {
    data.response.attestationObject = bytesB64(response.attestationObject);
    data.response.transports = response.getTransports ? response.getTransports() : [];
  } else {
    data.response.authenticatorData = bytesB64(response.authenticatorData);
    data.response.signature = bytesB64(response.signature);
    data.response.userHandle = response.userHandle ? bytesB64(response.userHandle) : null;
  }
  return data;
}
async function api(url, body) {
  const response = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : null});
  const data = await response.json();
  if (!response.ok) throw new Error(data.detail || 'Request failed');
  return data;
}
button.addEventListener('click', async () => {
  button.disabled = true; statusBox.className = 'status'; statusBox.textContent = 'Waiting for your device…';
  try {
    if (!window.PublicKeyCredential) throw new Error('This browser does not support passkeys.');
    let start, credential;
    if (action === 'register') {
      start = await api('/api/auth/register/options');
      credential = await navigator.credentials.create({publicKey: prepareCreate(start.options)});
      const done = await api('/api/auth/register/verify', {flow_token: start.flow_token, credential: serialize(credential)});
      location.href = nextPath || done.redirect;
    } else {
      start = await api('/api/auth/login/options');
      credential = await navigator.credentials.get({publicKey: prepareGet(start.options)});
      const done = await api('/api/auth/login/verify', {flow_token: start.flow_token, credential: serialize(credential)});
      location.href = nextPath || done.redirect;
    }
  } catch (error) {
    if (action === 'login' && (error.name === 'NotAllowedError' || String(error.message).includes('not registered'))) {
      action = 'register';
      button.textContent = 'Create passkey';
      statusBox.className = 'status';
      statusBox.textContent = 'No passkey found. Tap once more to create one.';
    } else {
      statusBox.className = 'status error';
      statusBox.textContent = error.message || String(error);
    }
    button.disabled = false;
  }
});
</script>
{% endblock %}
