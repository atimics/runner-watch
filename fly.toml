app = "runner-watch-ratimics"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "stonks-migrate"
  strategy = "rolling"
  max_unavailable = 1
  wait_timeout = "10m"

[processes]
  web = "uvicorn runner_web.main:app --host 0.0.0.0 --port 8080 --no-proxy-headers --timeout-graceful-shutdown 25 --no-access-log"
  worker = "env PROCESS_ROLE=worker MASSIVE_CACHE_PATH=/data/massive_daily.sqlite3 stonks-worker"
  trainer = "env PROCESS_ROLE=trainer stonks-trainer"

[[restart]]
  policy = "always"
  processes = ["worker", "trainer"]

# The Massive grouped-daily cache is a local SQLite file. Without a volume it
# is wiped by every deploy, so every scan falls back to slow Yahoo history.
[[mounts]]
  source = "massive_daily"
  destination = "/data"
  initial_size = "1gb"
  processes = ["worker"]

[env]
  APP_ORIGIN = "https://runners.rati.chat"
  RUNNERS_ORIGIN = "https://runners.rati.chat"
  SPORTS_ORIGIN = "https://sports.rati.chat"
  LEGACY_ORIGIN = "https://stonks.rati.foundation"
  RP_ID = "rati.chat"
  LEGACY_RP_ID = "stonks.rati.foundation"
  COOKIE_SECURE = "1"
  TRUST_FLY_CLIENT_IP = "1"
  WORKER_EXPECTED_INSTANCES = "1"
  PROCESS_ROLE = "web"
  REQUIRE_DATABASE_URL = "1"
  REQUIRE_RATE_LIMIT_HASH_KEY = "1"
  REQUIRE_EDGE_PROXY_SECRET = "1"
  REGISTRATION_MODE = "open"
  TELEGRAM_MEMECOIN_ALERTS = "1"

  # The release command runs migrations before this image serves traffic, so a
  # rollback after a schema change must tolerate a database the newer release
  # wrote. Do not enable this outside the production rollback path.
  ALLOW_NEWER_DATABASE_SCHEMA = "1"

  # Postgres and Redis are reached over Fly's encrypted private network
  # (`.internal`), so the drivers do not also negotiate TLS. Turn these on if
  # either service is ever addressed by a public hostname or over the internet.
  REQUIRE_DATABASE_TLS = "0"

  REQUIRE_REDIS_TLS = "0"
  PYTHONUNBUFFERED = "1"
  BACKGROUND_SCAN_INTERVAL_SECONDS = "1800"
  RANKER_TRAIN_INTERVAL_SECONDS = "21600"
  RANKER_TRAIN_HEARTBEAT_SECONDS = "30"
  RANKER_HISTORICAL_BACKFILL_ENABLED = "true"
  RANKER_HISTORICAL_BACKFILL_DAYS = "10"
  RANKER_HISTORICAL_BACKFILL_CADENCE_MINUTES = "15"
  RANKER_HISTORICAL_BACKFILL_TARGET_GROUPS = "160"
  RANKER_HISTORICAL_BACKFILL_SOURCE = "yahoo"
  SPORTS_INGESTION_ENABLED = "true"
  SPORTS_REFRESH_SECONDS = "600"
  ODDS_API_ENABLED = "true"
  ODDS_API_REGION = "us"
  ODDS_API_BOOKMAKERS = "bovada,draftkings,fanduel,betmgm,betonlineag"
  ODDS_API_PREFERRED_BOOKMAKERS = "bovada"
  ODDS_API_MONTHLY_WORKING_LIMIT = "450"
  ODDS_API_RESERVE_CREDITS = "50"
  ODDS_API_RETRY_SECONDS = "1800"
  DISCOVERY_SOURCES_ENABLED = "true"
  DISCOVERY_INTERVAL_SECONDS = "30"
  YAHOO_NEWS_ENABLED = "true"
  APEWISDOM_SOCIAL_ENABLED = "true"
  # Warm the whole year of grouped daily sessions in one cycle (the API limiter
  # still paces calls at MASSIVE_CALLS_PER_MINUTE).
  MASSIVE_BACKFILL_CALLS = "300"
  GDELT_NEWS_ENABLED = "false"
  BLUESKY_SEARCH_ENABLED = "false"
  NASDAQ_TRADE_HALTS_ENABLED = "true"
  HOUSE_DISCLOSURES_ENABLED = "true"
  SEC_USER_AGENT = "RATi-Runners/0.3 https://runners.rati.chat"
  ROBINHOOD_CHAIN_ENABLED = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 2
  processes = ["web"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 30

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["worker", "trainer"]
  size = "shared-cpu-1x"
  memory = "1gb"
