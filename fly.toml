app = "runner-watch-ratimics"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "stonks-migrate"
  strategy = "rolling"
  max_unavailable = 1
  wait_timeout = "10m"

[processes]
  web = "uvicorn runner_web.main:app --host 0.0.0.0 --port 8080 --no-proxy-headers --timeout-graceful-shutdown 25 --no-access-log"
  worker = "env PROCESS_ROLE=worker stonks-worker"
  trainer = "env PROCESS_ROLE=trainer stonks-trainer"

[env]
  APP_ORIGIN = "https://runners.rati.chat"
  RUNNERS_ORIGIN = "https://runners.rati.chat"
  SPORTS_ORIGIN = "https://sports.rati.chat"
  LEGACY_ORIGIN = "https://stonks.rati.foundation"
  RP_ID = "rati.chat"
  LEGACY_RP_ID = "stonks.rati.foundation"
  COOKIE_SECURE = "1"
  TRUST_FLY_CLIENT_IP = "1"
  WORKER_EXPECTED_INSTANCES = "1"
  PROCESS_ROLE = "web"
  REQUIRE_DATABASE_URL = "1"
  REQUIRE_RATE_LIMIT_HASH_KEY = "1"
  # Migrations are additive so the saved image can still start during rollback.
  ALLOW_NEWER_DATABASE_SCHEMA = "1"
  # Fly Postgres uses the encrypted private 6PN and does not accept direct TLS.
  REQUIRE_DATABASE_TLS = "0"
  # The Upstash endpoint resolves to the encrypted private 6PN and rejects TLS.
  REQUIRE_REDIS_TLS = "0"
  PYTHONUNBUFFERED = "1"
  BACKGROUND_SCAN_INTERVAL_SECONDS = "1800"
  RANKER_TRAIN_INTERVAL_SECONDS = "21600"
  SPORTS_INGESTION_ENABLED = "true"
  SPORTS_REFRESH_SECONDS = "600"
  ODDS_API_ENABLED = "true"
  ODDS_API_REGION = "us"
  ODDS_API_BOOKMAKERS = "bovada,draftkings,fanduel,betmgm,betonlineag"
  ODDS_API_PREFERRED_BOOKMAKERS = "bovada"
  ODDS_API_MONTHLY_WORKING_LIMIT = "450"
  ODDS_API_RESERVE_CREDITS = "50"
  ODDS_API_RETRY_SECONDS = "1800"
  DISCOVERY_SOURCES_ENABLED = "true"
  DISCOVERY_INTERVAL_SECONDS = "30"
  YAHOO_NEWS_ENABLED = "true"
  APEWISDOM_SOCIAL_ENABLED = "true"
  GDELT_NEWS_ENABLED = "false"
  BLUESKY_SEARCH_ENABLED = "false"
  NASDAQ_TRADE_HALTS_ENABLED = "true"
  SEC_USER_AGENT = "RATi-Runners/0.3 https://runners.rati.chat"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 2
  processes = ["web"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 30

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["worker", "trainer"]
  size = "shared-cpu-1x"
  memory = "1gb"
