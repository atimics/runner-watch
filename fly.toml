app = "runner-watch-ratimics"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "stonks-migrate"
  strategy = "rolling"
  max_unavailable = 1
  wait_timeout = "10m"

[processes]
  web = "uvicorn runner_web.main:app --host 0.0.0.0 --port 8080 --proxy-headers --forwarded-allow-ips '*' --timeout-graceful-shutdown 25 --no-access-log"
  worker = "env PROCESS_ROLE=worker stonks-worker"

[env]
  APP_ORIGIN = "https://stonks.rati.foundation"
  RP_ID = "stonks.rati.foundation"
  COOKIE_SECURE = "1"
  PROCESS_ROLE = "web"
  REQUIRE_DATABASE_URL = "1"
  REQUIRE_DATABASE_TLS = "1"
  REQUIRE_REDIS_TLS = "1"
  PYTHONUNBUFFERED = "1"
  BACKGROUND_SCAN_INTERVAL_SECONDS = "180"
  DISCOVERY_SOURCES_ENABLED = "true"
  DISCOVERY_INTERVAL_SECONDS = "30"
  YAHOO_NEWS_ENABLED = "true"
  APEWISDOM_SOCIAL_ENABLED = "true"
  GDELT_NEWS_ENABLED = "false"
  BLUESKY_SEARCH_ENABLED = "false"
  NASDAQ_TRADE_HALTS_ENABLED = "true"
  SEC_USER_AGENT = "RunnerWatch/0.2 https://stonks.rati.foundation"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 2
  processes = ["web"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 30

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "1gb"
