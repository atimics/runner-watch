app = "runner-watch-ratimics"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ORIGIN = "https://stonks.rati.foundation"
  RP_ID = "stonks.rati.foundation"
  DATABASE_PATH = "/data/runner-watch.db"
  COOKIE_SECURE = "1"
  PYTHONUNBUFFERED = "1"
  SEC_USER_AGENT = "RunnerWatch/0.2 https://stonks.rati.foundation"

[[mounts]]
  source = "runner_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 30

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
