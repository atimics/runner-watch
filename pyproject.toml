[project]
name = "runner-watch"
version = "0.1.0"
description = "A free-data stock momentum scanner for finding possible market runners early."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cryptography>=44",
  "defusedxml>=0.7.1",
  "fastapi>=0.116",
  "jinja2>=3.1",
  "keyring>=25.6",
  "numpy>=2.0",
  "pandas>=2.2",
  "pillow>=11.0",
  "pypdf>=6.13",
  "pydantic>=2.10",
  "psycopg[binary,pool]>=3.2",
  "redis>=5.2",
  "stripe>=14.0",
  "streamlit>=1.62",
  "uvicorn[standard]>=0.35",
  "webauthn>=2.2",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.12",
  "pip-audit>=2.9",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "pytest-playwright>=0.7",
  "ruff>=0.9",
]
desktop = [
  "pyinstaller>=6.15",
]

[project.scripts]
runner-watch = "runner_watch.cli:main"
stonks-ranker = "runner_web.ranker:main"
stonks-migrate = "runner_web.db:main"
stonks-migrate-sqlite = "runner_web.migrate_sqlite:main"
stonks-worker = "runner_web.main:worker_main"
stonks-trainer = "runner_web.ranker:trainer_main"
stonks-massive-backfill = "runner_watch.massive_data:main"
stonks-sec-export = "runner_web.sec_training:main"
stonks-sec-backfill = "runner_web.sec_backfill:main"
stonks-sec-export-v2 = "runner_web.sec_training_v2:main"
stonks-sec-publish-ilxyr = "runner_web.sec_ilxyr:main"
rati-scanner = "runner_node.app:main"
stonks-edge = "runner_web.edge_connector:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
cache_dir = ".test-cache.nosync/pytest"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
  "--cov=runner_watch",
  "--cov=runner_node",
  "--cov=runner_web",
  "--cov=runner_swarm",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "-m=not browser",
]
filterwarnings = [
  "error::ResourceWarning",
]
markers = [
  "browser: real Chromium behavior tests run separately from the unit suite",
]

[tool.coverage.run]
data_file = ".test-cache.nosync/coverage"

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
