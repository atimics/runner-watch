[project]
name = "runner-watch"
version = "0.1.0"
description = "A free-data stock momentum scanner for finding possible market runners early."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116",
  "jinja2>=3.1",
  "numpy>=2.0",
  "pandas>=2.2",
  "pillow>=11.0",
  "pydantic>=2.10",
  "streamlit>=1.62",
  "uvicorn[standard]>=0.35",
  "webauthn>=2.2",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
runner-watch = "runner_watch.cli:main"
stonks-ranker = "runner_web.ranker:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
