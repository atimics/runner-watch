name: Stock glyph verification
on:
  push:
    branches: [codex/stock-glyph-build]
permissions:
  contents: write
concurrency:
  group: stock-glyph-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 10
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.13'
      - name: Verify and apply exact patch and regression corrections
        shell: bash
        run: |
          cat .stock-glyph.part-* | base64 -d | gzip -d > /tmp/stock-glyph.diff
          echo '3f30e9b8977524237c66cc6d3b90a4042e47c1deeab92a1777573b48010e9f48  /tmp/stock-glyph.diff' | sha256sum --check
          git apply --check /tmp/stock-glyph.diff
          git apply /tmp/stock-glyph.diff
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('src/runner_web/market_screens.py')
          old = 'data.get("evidence_gate") or source.get("evidence_gate")'
          new = 'data.get("evidence_gate", source.get("evidence_gate"))'
          text = p.read_text()
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          p = Path('web/templates/market_screen.html')
          text = p.read_text()
          for old, new in [
              ('{% if screen.market == "stocks" and screen.kind != "detail" %}{{ indicator_legend() }}', '{% if screen is defined and screen.market == "stocks" and screen.kind != "detail" %}{{ indicator_legend() }}'),
              ('{% if screen.market == "stocks" %}<script src="/static/stock-indicator.js', '{% if screen is defined and screen.market == "stocks" %}<script src="/static/stock-indicator.js'),
          ]:
              assert text.count(old) == 1
              text = text.replace(old, new)
          p.write_text(text)
          p = Path('tests/test_stock_indicator.py')
          p.write_text(p.read_text() + '''

          @pytest.mark.parametrize("gate", [None, {}])
          def test_empty_authoritative_detail_gate_does_not_resurrect_saved_verification(gate):
              payload = {"ticker": "GLYPH", "current": stock(), "evidence_gate": gate}
              assert not detail("stocks", payload)["item"]["verified"]


          def test_shared_base_without_market_screen_does_not_load_stock_glyph():
              from jinja2 import Environment, FileSystemLoader

              env = Environment(loader=FileSystemLoader("web/templates"), autoescape=True)
              html = env.from_string(
                  '{% extends "market_screen.html" %}'
                  '{% block screen_title %}Report{% endblock %}'
                  '{% block topbar %}{% endblock %}'
                  '{% block screen_main %}<p>Saved report</p>{% endblock %}'
              ).render(static_version="test")
              assert "Saved report" in html
              assert "stock-indicator.js" not in html
              assert "stock-indicator.css" not in html
              assert "Indicator key" not in html
          ''')
          expected = {
              'src/runner_web/market_screens.py': '5faf9c4d8b3cfb42197c1792f1490aa2cc5a2d7ff20250f14a6cbcc004e639ae',
              'tests/test_stock_indicator.py': '0f52d95db2a7762b924ae28790b232179814344bb4fbb6525e4a2da8768e8919',
              'web/templates/market_screen.html': 'b041fd8a35439cbab8888e555a1d8a522dd179c9d25b39c9d12aa8a2a74b6130',
          }
          for path, digest in expected.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          PY
          git rm .stock-glyph.part-* .github/workflows/stock-glyph-build.yml
      - run: uv sync --locked --extra dev
      - name: Static and Rust checks
        run: |
          uv run ruff check src tests
          node --check web/static/stock-indicator.js
          cargo test --locked --manifest-path rust/stonks-ranker/Cargo.toml
          cargo build --locked --manifest-path rust/stonks-ranker/Cargo.toml
          git diff --check
      - name: Non-browser suite
        run: uv run pytest --no-cov -q -n 4 -m 'not browser' --junitxml=/tmp/glyph-unit.xml
      - run: uv run playwright install --with-deps chromium
      - name: Browser suite
        run: uv run pytest -q -n 4 -o addopts= -m browser --no-cov --screenshot only-on-failure --junitxml=/tmp/glyph-browser.xml
      - name: Commit verified tree on isolated branch only
        run: |
          test "$GITHUB_REF" = refs/heads/codex/stock-glyph-build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests web docs
          git diff --cached --check
          git commit -m 'Add proportional stock attention glyph and automated evidence check without changing run statuses'
          git push origin HEAD:refs/heads/codex/stock-glyph-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: stock-glyph-verification
          path: |
            /tmp/glyph-unit.xml
            /tmp/glyph-browser.xml
            test-results
            /tmp/stock-glyph.diff
            .stock-glyph.part-*
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
