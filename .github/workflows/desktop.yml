name: Desktop Builds

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/desktop.yml"
      - "desktop/**"
      - "scripts/rati_scanner_entry.py"
      - "scripts/stage_desktop_scanner.py"
      - "scripts/smoke_desktop_scanner.py"
      - "src/runner_node/**"
      - "src/runner_watch/**"
      - "src/runner_web/source_catalog.py"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop.yml"
      - "desktop/**"
      - "scripts/rati_scanner_entry.py"
      - "scripts/stage_desktop_scanner.py"
      - "scripts/smoke_desktop_scanner.py"
      - "src/runner_node/**"
      - "src/runner_watch/**"
      - "src/runner_web/source_catalog.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.19.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level low

  build:
    name: ${{ matrix.name }}
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: rati-swarm-linux
            bundles: deb,appimage
          - name: macOS
            os: macos-latest
            artifact: rati-swarm-macos
            bundles: app,dmg
          - name: Windows
            os: windows-latest
            artifact: rati-swarm-windows
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fakeroot \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf
      - name: Build scanner sidecar
        run: |
          uv sync --locked --extra desktop
          uv run pyinstaller --noconfirm --clean --onefile --name rati-scanner \
            --distpath desktop/.scanner-dist \
            --workpath desktop/.scanner-build \
            --specpath desktop/.scanner-spec \
            --collect-all keyring \
            scripts/rati_scanner_entry.py
      - name: Smoke test packaged scanner
        run: uv run python scripts/smoke_desktop_scanner.py
      - name: Stage Tauri scanner sidecar
        run: uv run python scripts/stage_desktop_scanner.py
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.19.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Check desktop client
        working-directory: desktop
        run: |
          pnpm check
          pnpm test
      - name: Build native package
        working-directory: desktop
        run: pnpm tauri build --bundles "${{ matrix.bundles }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
