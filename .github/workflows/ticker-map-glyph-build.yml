name: Ticker map source workspace
on:
  push:
    branches: [codex/ticker-map-glyph-build]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 14582905549c76ee9b0f2caf0cad47ad389d4af0
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD > /tmp/map-main-source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: map-main-source
          path: /tmp/map-main-source.tar.gz
          retention-days: 1
