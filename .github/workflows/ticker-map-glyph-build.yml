name: Ticker map glyph verification
on:
  push:
    branches: [codex/ticker-map-glyph-build]
permissions:
  contents: write
concurrency:
  group: ticker-map-glyph-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 12
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.13'
      - name: Apply exact patch and preserve interaction regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.map-glyph.part-0')
          text = p.read_text()
          assert text.count('CSFCpjz5qu7aheNg') == 1
          p.write_text(text.replace('CSFCpjz5qu7aheNg', 'CSFCpjz5qu7theNg'))
          PY
          cat .map-glyph.part-* | base64 -d | gzip -d > /tmp/ticker-map.diff
          echo '7b78c0c453952932113ee3728d5960ad255a87c2f57f02a290300cb7ff89cbc6  /tmp/ticker-map.diff' | sha256sum --check
          git apply --check /tmp/ticker-map.diff
          git apply /tmp/ticker-map.diff
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, hashlib
          p = Path('tests/test_browser_stock_map.py')
          text = p.read_text()
          old = '''        else:
                      # Interior of the evidence wedge, avoiding the risk overlay and separators.
                      point = page.locator("[data-map-graph]").evaluate'''
          new = '''        else:
                      # Interior of the evidence wedge, avoiding the risk overlay and separators.
                      segment.scroll_into_view_if_needed()
                      point = page.locator("[data-map-graph]").evaluate'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          base = subprocess.check_output(['git','show','14582905549c76ee9b0f2caf0cad47ad389d4af0:tests/test_browser_stock_map.py'], text=True)
          start = base.index('def test_source_failure_can_retry_and_reported_names_are_text')
          end = base.index('@pytest.mark.parametrize',start)
          text += '\n\n' + base[start:end].rstrip() + '\n'
          p.write_text(text)
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'c4c3e7293659425d6063cbb5b2b3b11fc4db550bc032d93b93e16f92d3fa73d0'
          PY
          git rm -f .map-glyph.part-* .github/workflows/ticker-map-glyph-build.yml
      - run: uv sync --locked --extra dev
      - name: Static and Rust checks
        run: |
          uv run ruff check src tests
          node --check web/static/ticker-map.js
          node --check web/static/stock-indicator.js
          cargo test --locked --manifest-path rust/stonks-ranker/Cargo.toml
          cargo build --locked --manifest-path rust/stonks-ranker/Cargo.toml
          git diff --check
      - name: Non-browser suite
        run: uv run pytest --no-cov -q -n 4 -m 'not browser' --junitxml=/tmp/map-unit.xml
      - run: uv run playwright install --with-deps chromium
      - name: Browser suite
        run: uv run pytest -q -n 4 -o addopts= -m browser --no-cov --screenshot only-on-failure --junitxml=/tmp/map-browser.xml
      - name: Capture actual ticker map rendering with synthetic fixtures
        run: |
          uv run python - <<'PY'
          from playwright.sync_api import sync_playwright
          from tests.test_browser_stock_map import open_map, score_current
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for width in (390,1280):
                  page = browser.new_page()
                  current = score_current(score=80,rug_score=35,sentiment='positive',score_components={'market':60,'sec_event':10,'news':5,'social_search':5},stage='RUNNING',trade_state='TRIGGERED',eligibility={'state':'eligible'},evidence_gate={'state':'ready','blockers':[]})
                  open_map(page,width,current=current)
                  page.locator('[data-person]').first.wait_for()
                  page.screenshot(path=f'/tmp/ticker-page-{width}.png',full_page=True)
                  page.locator('[data-stock-map]').screenshot(path=f'/tmp/ticker-map-{width}.png')
                  page.close()
              browser.close()
          PY
      - name: Commit verified tree to isolated branch only
        run: |
          test "$GITHUB_REF" = refs/heads/codex/ticker-map-glyph-build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web tests docs
          git diff --cached --check
          git commit -m 'Move stock attention glyph into ticker map and remove duplicate detail card'
          git push origin HEAD:refs/heads/codex/ticker-map-glyph-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ticker-map-verification
          path: |
            /tmp/map-unit.xml
            /tmp/map-browser.xml
            /tmp/ticker-map-*.png
            /tmp/ticker-page-*.png
            test-results
            /tmp/ticker-map.diff
            .map-glyph.part-*
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
