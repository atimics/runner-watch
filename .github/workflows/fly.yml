name: Fly Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fly-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run playwright install --with-deps chromium
      - run: cargo test --locked --manifest-path rust/stonks-ranker/Cargo.toml
      - run: cargo build --locked --manifest-path rust/stonks-ranker/Cargo.toml
      - run: uv run ruff check src tests
      - run: uv run pip-audit --local --skip-editable --progress-spinner off --timeout 10 --vulnerability-service osv
      - run: uv run pytest -q --cov-fail-under=68
      - run: uv run pytest -q tests/test_browser_pulse.py -o addopts=
      - run: docker compose -f compose.local.yml config --quiet
      - run: docker build --target test --tag runner-watch:test .

  deploy:
    name: Deploy app
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: fly-production
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Save rollback image
        id: rollback
        run: |
          image="$(flyctl releases --app runner-watch-ratimics --image --json | jq -r '[.[] | select(.Status == "complete" and .ImageRef != null)][0].ImageRef')"
          test -n "$image"
          test "$image" != "null"
          echo "image=$image" >> "$GITHUB_OUTPUT"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - id: deploy
        continue-on-error: true
        run: >-
          flyctl deploy --remote-only
          --build-arg APP_BUILD_SHA="${{ github.sha }}"
          --image-label "${{ github.sha }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Keep background processes running
        id: processes
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          flyctl scale count web=2 worker=1 trainer=1 --yes

          machines="$(flyctl machine list --json)"
          for group in worker trainer; do
            count="$(jq --arg group "$group" \
              '[.[] | select(.config.metadata.fly_process_group == $group)] | length' \
              <<<"$machines")"
            test "$count" -eq 1
          done

          jq -r '.[]
            | select(.config.metadata.fly_process_group == "worker"
              or .config.metadata.fly_process_group == "trainer")
            | select(.state != "started")
            | .id' <<<"$machines" \
            | xargs --no-run-if-empty flyctl machine start

          for _attempt in {1..12}; do
            details="$(curl --fail --silent --show-error --location --max-time 20 \
              https://runners.rati.chat/health/details 2>/dev/null || true)"
            if jq -e '.worker.status == "ok" and .trainer.status == "ok"' \
              <<<"$details" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Background process health check failed" >&2
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify production
        id: smoke
        if: steps.deploy.outcome == 'success' && steps.processes.outcome == 'success'
        continue-on-error: true
        run: >-
          EXPECTED_BUILD_SHA="${{ github.sha }}"
          scripts/smoke-production https://stonks.rati.foundation
      - name: Render every production screen
        id: screens
        if: steps.deploy.outcome == 'success' && steps.smoke.outcome == 'success'
        continue-on-error: true
        run: scripts/test-live-screens
      - name: Save failure screenshots
        if: always() && steps.screens.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-screen-failures
          path: test-results/live-screens
          if-no-files-found: ignore
      - name: Roll back failed release
        if: always() && (steps.deploy.outcome == 'failure' || steps.processes.outcome == 'failure' || steps.smoke.outcome == 'failure' || steps.screens.outcome == 'failure')
        run: flyctl deploy --remote-only --image "${{ steps.rollback.outputs.image }}" --strategy rolling --skip-release-command
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Report failed release
        if: always() && (steps.deploy.outcome == 'failure' || steps.processes.outcome == 'failure' || steps.smoke.outcome == 'failure' || steps.screens.outcome == 'failure')
        run: exit 1
