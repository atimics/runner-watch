name: Fly Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fly-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The gate runs as parallel jobs so the run's wall clock is the slowest job.
  # Pull requests skip coverage and shard the suites for fast feedback; main
  # runs the coverage gate before deploying.
  lint:
    name: Lint, rust and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: cargo test --locked --manifest-path rust/stonks-ranker/Cargo.toml
      - run: cargo build --locked --manifest-path rust/stonks-ranker/Cargo.toml
      - run: uv run ruff check src tests
      - run: |
          for script in web/static/*.js cloudflare-router/src/*.js; do
            node --check "$script"
          done
      - run: uv run pip-audit --local --skip-editable --progress-spinner off --timeout 10 --vulnerability-service osv
      - run: docker compose -f compose.local.yml config --quiet

  unit:
    name: Unit tests ${{ matrix.shard }}/5
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra dev
      # Coverage is measured on main only (the combine job below gates it), so
      # pull-request shards skip the tracing that roughly doubles the run.
      - name: Run the unit tests
        env:
          COVERAGE_FILE: coverage-${{ matrix.shard }}
        run: >-
          uv run pytest -q -n auto
          ${{ github.event_name == 'pull_request' && '--no-cov' || '' }}
          --splits 5 --group ${{ matrix.shard }}
          --junitxml=replay-unit-results-${{ matrix.shard }}.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: replay-unit-results-${{ matrix.shard }}
          path: replay-unit-results-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: github.event_name != 'pull_request'
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 3

  browser:
    name: Browser tests ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv run playwright install --with-deps chromium
      - run: >-
          uv run pytest -q -n auto -o addopts= -m browser --no-cov
          --splits 2 --group ${{ matrix.shard }}
          --junitxml=replay-browser-results-${{ matrix.shard }}.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: replay-browser-results-${{ matrix.shard }}
          path: replay-browser-results-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 3

  # Coverage stays a hard deploy gate. The shards each upload their partial
  # data, and this job combines them and enforces the threshold. It runs on
  # main only, so pull requests keep the fast untraced shards.
  coverage:
    name: Coverage gate
    needs: [unit]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: "coverage-*"
          path: coverage-data
          merge-multiple: true
      - name: Combine shard coverage and enforce the threshold
        run: |
          uv run --no-sync coverage combine coverage-data/coverage-*
          uv run --no-sync coverage report --fail-under=68

  evidence:
    name: Replay evidence
    needs: [unit, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: "*-results-*"
          path: reports
          merge-multiple: true
      - name: Record replay quality evidence
        run: uv run python scripts/record-replay-quality.py --reports reports/*.xml --output replay-quality.json
        env:
          REPLAY_REVIEWED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Save replay quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: memecoin-replay-quality
          path: |
            replay-quality.json
            reports/*.xml

  container:
    name: Container tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build and test the container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: test
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=runner-watch-test
          # Pull-request runs read the warm cache that main exports, but stop
          # exporting per-PR layer caches so the shared 10 GB budget is not
          # exhausted and main's cache stays reusable.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=runner-watch-test,mode=max' || '' }}
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Authenticate to the Fly registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Build and publish the runtime image
        # Build once here with the warm GitHub cache, then deploy the artifact
        # instead of rebuilding everything on Fly's remote builder.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          build-args: APP_BUILD_SHA=${{ github.sha }}
          tags: registry.fly.io/runner-watch-ratimics:build-${{ github.sha }}
          cache-from: type=gha,scope=runner-watch-test
          cache-to: type=gha,scope=runner-watch-test,mode=max

  test:
    name: Test and lint
    needs: [lint, unit, browser, evidence, coverage, container]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test job
        env:
          EVENT_NAME: ${{ github.event_name }}
          LINT_RESULT: ${{ needs.lint.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          test "$LINT_RESULT" = "success"
          test "$UNIT_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
          test "$EVIDENCE_RESULT" = "success"
          test "$CONTAINER_RESULT" = "success"
          # Coverage only runs on main; there it must pass before deploying.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            test "$COVERAGE_RESULT" = "success"
          fi

  deploy:
    name: Deploy app
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: fly-production
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Save rollback image
        id: rollback
        run: |
          image="$(flyctl releases --app runner-watch-ratimics --image --json | jq -r '[.[] | select(.Status == "complete" and .ImageRef != null)][0].ImageRef')"
          test -n "$image"
          test "$image" != "null"
          echo "image=$image" >> "$GITHUB_OUTPUT"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - id: deploy
        continue-on-error: true
        run: >-
          flyctl deploy
          --image registry.fly.io/runner-watch-ratimics:build-${{ github.sha }}
          --image-label "${{ github.sha }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - id: edge_credentials
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy public edge router
        id: edge
        if: steps.deploy.outcome == 'success' && steps.edge_credentials.outputs.available == 'true'
        continue-on-error: true
        run: >-
          npx --yes wrangler@4.127.1 deploy
          --config cloudflare-router/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Keep background processes running
        id: processes
        if: steps.deploy.outcome == 'success' && (steps.edge.outcome == 'success' || steps.edge.outcome == 'skipped')
        continue-on-error: true
        run: |
          flyctl scale count web=2 worker=1 trainer=1 --yes

          machines="$(flyctl machine list --json)"
          for group in worker trainer; do
            count="$(jq --arg group "$group" \
              '[.[] | select(.config.metadata.fly_process_group == $group)] | length' \
              <<<"$machines")"
            test "$count" -eq 1
            jq -e --arg group "$group" \
              '[.[] | select(.config.metadata.fly_process_group == $group)] | all(.config.restart.policy == "always")' \
              <<<"$machines"
          done

          jq -r '.[]
            | select(.config.metadata.fly_process_group == "worker"
              or .config.metadata.fly_process_group == "trainer")
            | select(.state != "started")
            | .id' <<<"$machines" \
            | xargs --no-run-if-empty flyctl machine start

          for _attempt in {1..12}; do
            if flyctl ssh console --app runner-watch-ratimics --process-group web \
              --command "python -m runner_web.deployment_check" --quiet; then
              exit 0
            fi
            sleep 5
          done
          echo "Background process health check failed" >&2
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify production
        id: smoke
        if: steps.deploy.outcome == 'success' && steps.processes.outcome == 'success'
        continue-on-error: true
        run: |
          scripts/smoke-production https://runners.rati.chat
          scripts/smoke-production https://sports.rati.chat
        env:
          EXPECTED_BUILD_SHA: ${{ github.sha }}
      - name: Render every production screen
        id: screens
        if: steps.deploy.outcome == 'success' && steps.smoke.outcome == 'success'
        continue-on-error: true
        run: scripts/test-live-screens
        env:
          # A rolling deploy leaves cold caches and a thin fleet behind it, so the
          # rollout gate allows a longer budget and one more attempt than the warm
          # uptime monitor, which keeps the strict 3500ms / 3 attempt defaults.
          LIVE_SCREEN_FAILURE_MS: "5000"
          LIVE_SCREEN_RETRIES: "4"
      - name: Save failure screenshots
        if: always() && steps.screens.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-screen-failures
          path: test-results/live-screens
          if-no-files-found: ignore
      - name: Roll back failed release
        if: always() && (steps.deploy.outcome == 'failure' || steps.edge.outcome == 'failure' || steps.processes.outcome == 'failure' || steps.smoke.outcome == 'failure' || steps.screens.outcome == 'failure')
        run: flyctl deploy --remote-only --image "${{ steps.rollback.outputs.image }}" --strategy rolling --skip-release-command
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Report failed release
        if: always() && (steps.deploy.outcome == 'failure' || steps.edge.outcome == 'failure' || steps.processes.outcome == 'failure' || steps.smoke.outcome == 'failure' || steps.screens.outcome == 'failure')
        run: exit 1
