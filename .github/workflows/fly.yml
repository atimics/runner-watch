name: Fly Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: cargo test --locked --manifest-path rust/stonks-ranker/Cargo.toml
      - run: cargo build --locked --manifest-path rust/stonks-ranker/Cargo.toml
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  deploy:
    name: Deploy app
    needs: test
    runs-on: ubuntu-latest
    concurrency: fly-production
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
