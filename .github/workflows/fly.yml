name: Fly Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fly-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run playwright install --with-deps chromium
      - run: cargo test --locked --manifest-path rust/stonks-ranker/Cargo.toml
      - run: cargo build --locked --manifest-path rust/stonks-ranker/Cargo.toml
      - run: uv run ruff check src tests
      - run: uv run pip-audit --local --skip-editable --progress-spinner off --timeout 10 --vulnerability-service osv
      - run: uv run pytest -q --cov-fail-under=68
      - run: uv run pytest -q tests/test_browser_pulse.py -o addopts=
      - run: docker build --target test --tag runner-watch:test .

  deploy:
    name: Deploy app
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: fly-production
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Save rollback image
        id: rollback
        run: |
          image="$(flyctl releases --app runner-watch-ratimics --image --json | jq -r '[.[] | select(.Status == "complete" and .ImageRef != null)][0].ImageRef')"
          test -n "$image"
          test "$image" != "null"
          echo "image=$image" >> "$GITHUB_OUTPUT"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - id: deploy
        continue-on-error: true
        run: flyctl deploy --remote-only --image-label "${{ github.sha }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify production
        id: smoke
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: scripts/smoke-production https://stonks.rati.foundation
      - name: Roll back failed release
        if: always() && (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: flyctl deploy --remote-only --image "${{ steps.rollback.outputs.image }}" --strategy rolling --skip-release-command
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Report failed release
        if: always() && (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: exit 1
