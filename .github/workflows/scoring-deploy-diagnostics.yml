name: Scoring deployment diagnostics
on:
  push:
    branches: [codex/scoring-deploy-diagnostics]
permissions:
  contents: read
jobs:
  verify-public-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check exact build, readiness and public scoring contract
        run: |
          python3 - <<'PY'
          import json, subprocess, time
          expected = '7e44356b8974272c9ee0cdad25bf97e4c4e12e7b'
          origins = ['https://runners.rati.chat', 'https://sports.rati.chat']
          def read(url):
              result = subprocess.run(['curl','--fail','--silent','--show-error','--max-time','20',url],check=True,capture_output=True,text=True)
              return json.loads(result.stdout)
          for attempt in range(4):
              try:
                  builds = {origin: read(origin + '/api/version')['build_sha'] for origin in origins}
                  if all(value == expected for value in builds.values()):
                      break
                  print('builds', json.dumps(builds), flush=True)
              except subprocess.CalledProcessError as error:
                  print('HTTP failure', error.stderr, flush=True)
              time.sleep(5)
          else:
              raise SystemExit('Expected build is not serving both origins')
          print('verified_builds', json.dumps(builds), flush=True)
          for origin in origins:
              for endpoint in ['/ready', '/health']:
                  result = subprocess.run(['curl','--fail','--silent','--show-error','--max-time','20','--output','/dev/null','--write-out','%{http_code}',origin+endpoint],check=True,capture_output=True,text=True)
                  assert result.stdout == '200', result.stdout
                  print(origin + endpoint, result.stdout, flush=True)
          payload = read(origins[0] + '/api/pulse?limit=5')
          rows = payload.get('items') or payload.get('rows') or []
          assert rows, 'No live sample to verify'
          for row in rows:
              assert row.get('score_policy') == 'attention-activity-v2', row.get('score_policy')
              assert row.get('score_unit') == 'heuristic_points', row.get('score_unit')
              assert row.get('eligibility', {}).get('state') in {'eligible', 'blocked', 'unknown'}
              assert row.get('computed_at')
          print('verified_scoring_sample', json.dumps([{key: row.get(key) for key in ['ticker', 'score', 'score_policy', 'score_unit', 'eligibility', 'feature_as_of', 'quote_as_of', 'computed_at']} for row in rows]), flush=True)
          PY
