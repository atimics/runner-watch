name: Scoring deployment diagnostics
on:
  push:
    branches: [codex/scoring-deploy-diagnostics]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Machine states only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl machine list --app runner-watch-ratimics --json | jq '[.[] | {id, state, process_group: .config.metadata.fly_process_group, image: .config.image}]'
          flyctl releases --app runner-watch-ratimics --image --json | jq '.[0:4] | map({Version, Status, ImageRef})'
      - name: Read-only migration and database wait metadata
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import shlex, subprocess
          code = '''import os,json,psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'],connect_timeout=10,options='-c default_transaction_read_only=on -c statement_timeout=15000',row_factory=dict_row) as c:
              print('migration_status',json.dumps(c.execute('SELECT version,name,applied_at FROM schema_migrations ORDER BY version DESC LIMIT 5').fetchall(),default=str))
              print('active_waits',json.dumps(c.execute("SELECT pid,state,wait_event_type,wait_event,pg_blocking_pids(pid) AS blockers,EXTRACT(EPOCH FROM now()-query_start)::int AS age_seconds,CASE WHEN query ILIKE '%pg_advisory_lock%' THEN 'migration_lock' WHEN query ILIKE '%UPDATE ranker_training_examples%' THEN 'training_repair' WHEN query ILIKE '%UPDATE scan_outcomes%' THEN 'outcome_update' ELSE 'other' END AS query_kind FROM pg_stat_activity WHERE datname=current_database() AND pid<>pg_backend_pid() AND state<>'idle' ORDER BY query_start LIMIT 30").fetchall(),default=str))
              print('table_estimates',json.dumps(c.execute("SELECT relname,n_live_tup,n_dead_tup FROM pg_stat_user_tables WHERE relname IN ('scan_outcomes','ranker_training_examples','scan_snapshots')").fetchall(),default=str))
          '''
          command = 'python -c ' + shlex.quote(code)
          subprocess.run(['flyctl','ssh','console','--app','runner-watch-ratimics','--process-group','web','--command',command,'--quiet'],check=True,timeout=90)
          PY
      - name: Public build and readiness after rollback
        if: always()
        run: |
          for origin in https://runners.rati.chat https://sports.rati.chat; do
            echo "$origin"
            curl --fail --silent --show-error --max-time 30 "$origin/api/version"
            echo
            curl --silent --show-error --output /dev/null --write-out 'ready HTTP %{http_code}\n' --max-time 30 "$origin/ready"
            curl --silent --show-error --output /dev/null --write-out 'health HTTP %{http_code}\n' --max-time 30 "$origin/health"
          done
