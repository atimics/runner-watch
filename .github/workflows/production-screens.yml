name: Production Screens

on:
  schedule:
    # Run off the top of the hour, when scheduled Actions are busiest.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-screens
  cancel-in-progress: false

# fly.yml already renders every screen after deployment and rolls back failures.
# Do not add a workflow_run/deployment trigger here and duplicate that gate.
jobs:
  screens:
    name: Render every production screen
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Render every production screen
        run: scripts/test-live-screens
      - name: Save failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-screen-failures
          path: test-results/live-screens
          if-no-files-found: ignore
