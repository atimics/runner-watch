name: Rust Dependency Audit

on:
  pull_request:
    paths:
      - ".github/workflows/rust-audit.yml"
      - "desktop/src-tauri/Cargo.lock"
      - "rust/stonks-ranker/Cargo.lock"
  schedule:
    - cron: "19 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Check new Rust advisories
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a96bc4d2b09685b6142bcfe25a3dc17cb2d7347
    with:
      scan-args: |-
        --lockfile=./rust/stonks-ranker/Cargo.lock
        --recursive
        ./desktop
      upload-sarif: false
      fail-on-vuln: true

  full:
    name: Check all Rust advisories
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a96bc4d2b09685b6142bcfe25a3dc17cb2d7347
    with:
      scan-args: |-
        --lockfile=./rust/stonks-ranker/Cargo.lock
        --recursive
        ./desktop
      upload-sarif: false
      fail-on-vuln: true
