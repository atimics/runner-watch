name: Production Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-uptime
  cancel-in-progress: false

jobs:
  database:
    name: Check database free space
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - run: python3 scripts/check-database-storage.py --app runner-watch-db
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DATABASE_API_TOKEN }}

  workers:
    name: Check worker and trainer health
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl --fail --silent --show-error --max-time 15 --retry 2 --retry-delay 5 https://runners.rati.chat/health/workers

  data:
    name: Check feed freshness
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        origin: ["https://runners.rati.chat", "https://sports.rati.chat"]
    steps:
      - run: curl --fail --silent --show-error --max-time 15 --retry 2 --retry-delay 5 "${{ matrix.origin }}/health/data"

  monitor:
    name: Check production
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # HTTP probes only. Browser rendering runs hourly in production-screens.yml
      # and remains a blocking post-deploy/rollback gate in fly.yml.
      - run: scripts/smoke-production https://runners.rati.chat
      - run: scripts/smoke-production https://sports.rati.chat
