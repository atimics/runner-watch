name: Production Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-uptime
  cancel-in-progress: false

jobs:
  monitor:
    name: Check production
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.13"
          enable-cache: true
      - run: scripts/smoke-production https://stonks.rati.foundation
      - name: Render every production screen
        run: scripts/test-live-screens
      - name: Save failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-screen-failures
          path: test-results/live-screens
          if-no-files-found: ignore
