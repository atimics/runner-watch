name: Mobile sparklines verification
on:
  push:
    branches: [codex/mobile-sparklines-build]
permissions:
  contents: write
concurrency:
  group: mobile-sparklines-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 8
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.13'
      - name: Apply and verify exact source tree
        shell: bash
        run: |
          cat .mobile-sparklines.part-* | base64 -d | gzip -d > /tmp/mobile-sparklines.diff
          echo '25f59b4759d5abfd8cbe54bd1822c6a331dba61d65dbaa943e087b92a9e803dc  /tmp/mobile-sparklines.diff' | sha256sum --check
          git apply --check /tmp/mobile-sparklines.diff
          git apply /tmp/mobile-sparklines.diff
          git rm .mobile-sparklines.part-* .github/workflows/mobile-sparklines-build.yml
          git add src web docs tests
          test "$(git write-tree)" = '8b03fdc3741242c833e5ff1dba4d9fec8dca1ffc'
      - run: uv sync --locked --extra dev
      - name: Static and Rust checks
        run: |
          uv run ruff check src tests
          node --check web/static/ticker-row.js
          node --check web/static/market-screen.js
          cargo test --locked --manifest-path rust/stonks-ranker/Cargo.toml
          cargo build --locked --manifest-path rust/stonks-ranker/Cargo.toml
          git diff --cached --check
      - name: Complete non-browser suite
        run: uv run pytest --no-cov -q -n 4 -m 'not browser' --junitxml=/tmp/sparklines-unit.xml
      - run: uv run playwright install --with-deps chromium
      - name: Complete browser suite
        run: uv run pytest -q -n 4 -o addopts= -m browser --no-cov --screenshot only-on-failure --junitxml=/tmp/sparklines-browser.xml
      - name: Capture real rendering using synthetic fixtures
        run: |
          uv run python - <<'PY'
          from playwright.sync_api import sync_playwright
          from tests.test_browser_mobile_sparklines import open_list
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for width in (320, 390, 1280):
                  page = browser.new_page()
                  state = open_list(page, width=width)
                  assert not state['errors'], state['errors']
                  page.screenshot(path=f'/tmp/mobile-sparklines-{width}.png',full_page=True)
                  page.close()
              browser.close()
          PY
      - name: Commit verified source on isolated branch only
        run: |
          test "$GITHUB_REF" = refs/heads/codex/mobile-sparklines-build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git write-tree)" = '8b03fdc3741242c833e5ff1dba4d9fec8dca1ffc'
          git commit -m 'Restore mobile stock sparklines with unchanged status labels and palette'
          git push origin HEAD:refs/heads/codex/mobile-sparklines-build
          git rev-parse HEAD HEAD^{tree}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mobile-sparklines-verification
          path: |
            /tmp/sparklines-unit.xml
            /tmp/sparklines-browser.xml
            /tmp/mobile-sparklines-*.png
            /tmp/mobile-sparklines.diff
            test-results
          retention-days: 3
          if-no-files-found: ignore
