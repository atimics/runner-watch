[package]
name = "rati-swarm"
version = "1.0.0"
description = "RATi Runners desktop shell"
authors = ["RATi"]
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "rati_swarm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[patch.crates-io]
glib = { path = "vendor/glib" }
urlpattern = { path = "vendor/urlpattern" }
